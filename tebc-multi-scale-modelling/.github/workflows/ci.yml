name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight test deps
        # Skip heavy scientific packages (fenicsx, pymatgen, fipy, pycalphad,
        # phonopy, deepmd) on CI — they need conda. Only install what the
        # core unit tests in tests/ actually import.
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas salib pytest pytest-cov

      - name: Install package (no extras)
        run: pip install -e . --no-deps

      - name: Run tests
        run: pytest -ra --cov=tebc --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check tebc tests

  heavy-test:
    # Optional job that installs the conda-forge scientific stack so the
    # Scale 1 (pymatgen), Scale 3 (fipy, pycalphad), and DP-GEN code paths
    # actually get exercised. Marked continue-on-error because the conda
    # solve is fragile — the lightweight `test` job remains authoritative.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: tebc-heavy
          python-version: "3.11"
      - name: Install heavy stack
        run: |
          conda install -y -c conda-forge \
            numpy scipy pandas salib pytest pytest-cov \
            pymatgen phonopy fipy pycalphad ase
      - name: Install package
        run: pip install -e . --no-deps
      - name: Run tests
        run: pytest -ra
